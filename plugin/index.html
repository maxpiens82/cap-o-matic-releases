<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<title>Cap-o-matic</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <img class="logo" src="assets/logo.png" alt="" width="22" height="22">
      <span class="name">Cap-o-matic</span>
      <span class="tl" id="tlInfo"></span>
    </div>
    <div class="top-tools">
      <button class="pin" id="pinBtn" type="button"></button>
      <button class="conn" id="connBtn" type="button" title="Reload from Resolve"><span class="dot" id="connDot"></span><span id="connText"></span></button>
    </div>
  </header>
  <div class="body">
    <nav class="rail" id="rail" aria-label="Steps"></nav>
    <main class="screen" id="screen"></main>
  </div>
  <footer class="bottom" id="footer"></footer>
</div>
<script src="core/timecode.js"></script>
<script src="core/transcript.js"></script>
<script src="core/phrases.js"></script>
<script src="core/srt.js"></script>
<script src="core/edit.js"></script>
<script src="core/textfx.js"></script>
<script src="core/presets.js"></script>
<script src="core/builtins.js"></script>
<script src="core/fonts.js"></script>
<script src="core/timing.js"></script>
<script src="js/i18n.js"></script>
<script src="js/dom.js"></script>
<script src="js/styles.js"></script>
<script src="js/mock.js"></script>
<script src="js/app.js"></script>
</body>
</html>
